services:
  - type: web
    name: mardon-portfolio
    env: python
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /api/health

    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./portfolio.db
      - key: ALLOWED_ORIGINS
        value: ""
      - key: PYTHONPATH
        value: /app/backend
